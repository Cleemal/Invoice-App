name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create Android shell
        run: flutter create build_app --org com.clee.invoice --project-name invoice_app --platforms android
      - name: Copy our code in
        run: |
          cp pubspec.yaml build_app/pubspec.yaml
          rm -rf build_app/lib build_app/test
          cp -r lib build_app/lib
          sed -i 's/android:label="[^"]*"/android:label="Invoice Maker"/' build_app/android/app/src/main/AndroidManifest.xml
      - name: Build
        working-directory: build_app
        run: |
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
